# Thousandvale on a VPS — the game process talks to THIS MACHINE ONLY (systemd drop-in, installed by
# ops/vps/bootstrap.sh to /etc/systemd/system/thousandvale.service.d/localhost-only.conf).
#
# Visitors reach it through Caddy (127.0.0.1), and it reaches Postgres on 127.0.0.1. Anything else — a packet from
# the internet if the firewall were ever opened, or the game calling out — is dropped by the kernel.
# Remove it only if the human check (Turnstile) is switched on: the server must then reach challenges.cloudflare.com.
[Service]
IPAddressDeny=any
IPAddressAllow=localhost
