<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bannerline Icon Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/bench.css">
<link rel="stylesheet" href="css/icons.css">
<script type="importmap">{ "imports": { "three": "../../vendor/three/three.module.js", "three/addons/": "../../vendor/three/addons/" } }</script>
</head>
<body class="tool-page">
<!-- Generate icons from the 3D models (PLAN §16): every unit, hero, item base and skill, rendered with
     the same models the game draws. tools/bake-icons.mjs drives this page and writes assets/icons/. -->
<div class="icons-page">
  <header class="bench-bar">
    <a class="back" href="./">&larr; Bannerline</a>
    <h1>Icon Forge</h1>
    <span class="muted" id="state">Loading models&hellip;</span>
    <span class="spacer"></span>
    <label>Show <select id="source"><option value="baked">Baked files</option><option value="live">Render live</option></select></label>
    <button class="btn primary" id="render" disabled>Re-render all</button>
  </header>
  <canvas id="gl" width="512" height="512" aria-hidden="true"></canvas>
  <main id="gallery" class="gallery"></main>
</div>
<script type="module" src="js/tools/icons-page.js"></script>
</body>
</html>
