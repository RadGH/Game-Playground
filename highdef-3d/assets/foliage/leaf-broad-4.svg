<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Broadleaf cluster 4: ovate, pointed leaves (hornbeam / elm shape) with a
       hint of autumn - two leaves have turned yellow-olive. Nine leaves, dense
       in the middle with ragged transparent edges. -->
