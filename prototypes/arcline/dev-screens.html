<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05070f">
<title>Arcline screens (dev)</title>
<link rel="stylesheet" href="css/screens.css">
<script type="importmap">{ "imports": { "three": "../../vendor/three/three.module.js", "three/addons/": "../../vendor/three/addons/" } }</script>
<style>html, body { margin: 0; height: 100%; background: #05070f; overflow: hidden; } #app { position: fixed; inset: 0; }</style>
</head>
<body>
<!-- Dev page for the screens around the city view (js/ui/screens.js) with a stub app.
     ?demo=1 makes a demo world with three cities · ?screen=new|map opens that screen first · ?clear=1 wipes Arcline saves -->
<div id="app"></div>
<div id="panels"></div>
<div id="toasts" aria-live="polite"></div>
<script type="module">
import { showTitle, showNewWorld, showWorldMap, screenState } from './js/ui/screens.js';
import { toast } from './js/ui/dom.js';
import * as S from './js/save.js';
import { useTuning } from './js/sim/tuning.js';
import { newRegion, found } from './js/sim/region.js';

useTuning(await (await fetch('data/tuning.json')).json());
const q = new URLSearchParams(location.search);
if (q.has('clear')) for (const k of S.storage.keys()) if (k.startsWith('arcline.')) S.storage.remove(k);

async function demoWorld() {
  const ws = S.newWorldSave({ name: 'Vesara Prime', seed: 52817, cells: 14, pressure: 1 });
  const picks = ws.world.regions.filter(r => r.land > 0.7).sort((a, b) => b.span - a.span);
  const chosen = [picks[0], ...ws.world.regions.filter(r => r.land > 0.6 && r !== picks[0] && Math.abs(r.cx - picks[0].cx) + Math.abs(r.cz - picks[0].cz) <= 5).slice(0, 2)];
  const pop = [4820, 1260, 310];
  for (const [i, wr] of chosen.entries()) {
    const reg = newRegion(ws.world, wr); found(reg, 20, 20);
    reg.people.total = pop[i]; reg.money = 18000 - i * 7000; reg.milestone = 4 - i; reg.day = 400 - i * 150; reg.rates.money = 420 - i * 160;
    await S.saveRegionTo(ws.meta.id, reg);
  }
  return ws.meta.id;
}
if (q.has('demo') && !S.listWorlds().some(w => w.name === 'Vesara Prime')) await demoWorld();

const app = {
  root: document.getElementById('app'),
  settings: S.loadSettings(),
  onSettings: s => console.info('[dev] settings', JSON.stringify(s)),
  playRegion: (ws, id) => { const r = ws.world.regions[id]; toast(`Would open ${r.city?.name || r.name} (${r.city?.founded ? 'play' : 'found a city'})`, 'good'); setTimeout(() => showWorldMap(app, ws, { focus: id }), 50); },
  awaySummary: (ws, id) => { const c = ws.world.regions[id].city; return c?.founded && c.rates?.money > 300 ? [`Earned 12,400 credits and 340 Metal over 3 days.`, 'Two settler pods landed: +46 people.'] : null; },
};
window.app = app;
window.gameEye = { state: () => screenState() };
const screen = q.get('screen');
if (screen === 'new') showNewWorld(app);
else if (screen === 'map') { const w = S.lastWorld(); if (w) showWorldMap(app, await S.loadWorld(w.id)); else showTitle(app); }
else showTitle(app);
</script>
</body>
</html>
