<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bannerline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../shared/tooltip.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/hud.css">
<link rel="stylesheet" href="css/controlbar.css">
<script type="importmap">{ "imports": { "three": "../../vendor/three/three.module.js", "three/addons/": "../../vendor/three/addons/" } }</script>
</head>
<body>
<div id="app">
  <!-- The 3D view sits behind every screen; the title uses it for a slow fly-over. -->
  <canvas id="view" aria-label="Battlefield"></canvas>
  <div id="overlay" class="overlay" aria-hidden="true"></div>

  <section id="screen-title" class="screen title-screen" data-ui>
    <div class="title-card">
      <div class="crest" aria-hidden="true"></div>
      <h1 class="logo">Bannerline</h1>
      <p class="tagline">Hold your field. Muster against theirs. Keep your banners flying.</p>
      <nav class="menu" id="title-menu">
        <button class="menu-btn primary" data-act="play-ai">Play vs AI</button>
        <button class="menu-btn" data-act="local" disabled>Play Local <small>two on one screen · soon</small></button>
        <button class="menu-btn" data-act="host" disabled>Host Online <small>soon</small></button>
        <button class="menu-btn" data-act="join" disabled>Join by Code <small>soon</small></button>
        <button class="menu-btn" data-act="campaign" disabled>Campaign <small>soon</small></button>
      </nav>
      <div class="setup" id="title-setup" hidden>
        <div class="setup-row"><span class="setup-label">Hero</span><div class="chips" id="pick-hero"></div></div>
        <div class="setup-row"><span class="setup-label">Muster</span><div class="chips" id="pick-race"></div></div>
        <div class="setup-row"><span class="setup-label">Opponent</span><div class="chips" id="pick-ai"></div></div>
        <div class="setup-row"><span class="setup-label">Speed</span><div class="chips" id="pick-speed"></div></div>
        <div class="setup-actions">
          <button class="menu-btn" data-act="back">Back</button>
          <button class="menu-btn primary" data-act="start" id="btn-start">March <kbd>Enter</kbd></button>
        </div>
      </div>
      <p class="hint" id="title-hint">Keyboard + mouse. Press <kbd>Enter</kbd> to begin.</p>
    </div>
    <div class="title-foot">A playground prototype by Radley Sustaire</div>
  </section>

  <section id="screen-match" class="screen match-screen" hidden>
    <div id="hud" class="hud"></div>
  </section>

  <section id="screen-results" class="screen results-screen" hidden data-ui>
    <div class="results-card" id="results-card"></div>
  </section>

  <div id="boot" class="boot">Loading the vale…</div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
