<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Forge</title>
<link rel="stylesheet" href="../shared/style.css">
<link rel="stylesheet" href="worldgen.css">
</head>
<body>
<div class="topbar">
  <a href="../" class="muted">← Playground</a>
  <h1>World Forge</h1>
  <span class="muted small">Procedural world maps: continents, climate, rivers, regions, towns and roads — then zoom in twice.</span>
  <span class="spacer"></span>
  <span id="status" class="small muted">booting…</span>
</div>
<div class="layout three">
  <aside class="sidebar" id="left"></aside>
  <main class="main map-main" id="main">
    <div class="crumbs" id="crumbs"></div>
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="map"></canvas>
      <div class="progress" id="progress" hidden><div class="bar"><span id="progressBar"></span></div><div id="progressLabel" class="small muted">working…</div></div>
    </div>
    <div class="readout" id="readout"><span class="muted small">Hover the map for cell details. Click a region to zoom in.</span></div>
    <div class="legend" id="legend"></div>
  </main>
  <aside class="sidebar right" id="right"></aside>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
