# Thousandvale on a small VPS (2-4 GB RAM) — installed by ops/vps/bootstrap.sh to
# /etc/postgresql/<version>/main/conf.d/thousandvale.conf. Sized for one game server + a handful of players.
listen_addresses = 'localhost'
max_connections = 40
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 8MB
maintenance_work_mem = 64MB
wal_compression = on
