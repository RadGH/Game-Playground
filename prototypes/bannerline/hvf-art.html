<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hunters vs Farmers Art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/bench.css">
<script type="importmap">{ "imports": { "three": "../../vendor/three/three.module.js", "three/addons/": "../../vendor/three/addons/" } }</script>
</head>
<body class="tool-page">
<!-- Hunters vs Farmers art (stream C): a generated forest dressed with js/view/hvf-nature.js, a farm in
     a hollow (js/view/hvf-structures.js), the animals as instanced baked poses (avatar-3d/js/creature-poses.js),
     the farmer, the hunter, a ghost, scarecrows and crows. Or a line-up of every building. -->
<div class="bench">
  <header class="bench-bar">
    <a class="back" href="./">&larr; Bannerline</a>
    <h1>Hunters vs Farmers Art</h1>
    <span class="muted" id="state">Loading&hellip;</span>
    <span class="spacer"></span>
    <label>View <select id="view"><option value="world">The forest</option><option value="lineup">Buildings</option><option value="cast">Animals + people</option></select></label>
    <label>Seed <select id="seed"><option>3</option><option>11</option><option>29</option></select></label>
    <button class="btn" id="chop">Chop a tree</button>
    <button class="btn" id="damage">Damage / build</button>
  </header>
  <div class="bench-main" style="height: calc(100vh - 60px)"><canvas id="view3d"></canvas><div class="bench-live" id="live">--</div></div>
</div>
<script type="module" src="js/tools/hvf-art-page.js"></script>
</body>
</html>
