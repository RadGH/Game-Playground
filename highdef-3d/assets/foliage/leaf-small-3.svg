<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Small leaves 3: rowan-like. Narrow toothed leaflets in opposite pairs,
       cooler and darker green, on arching stalks. Densest toward the middle. -->
  <defs>
    <linearGradient id="lf" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#6c8a55"/>
      <stop offset="1" stop-color="#43603a"/>
    </linearGradient>
    <linearGradient id="lf2" x1="0.3" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f7d4c"/>
      <stop offset="1" stop-color="#3d5735"/>
    </linearGradient>
    <linearGradient id="lu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a7c5c"/>
      <stop offset="1" stop-color="#46563e"/>
    </linearGradient>
    <!-- toothed edge: little steps along each side -->
    <path id="r" d="M0,-24 L3,-18 L2,-16 L5,-10 L4,-8 L6,-2 L5,0 L6,6 L5,8 L4,14 L3,16 L1,21 L0,24 L-1,21 L-3,16 L-4,14 L-5,8 L-6,6 L-5,0 L-6,-2 L-4,-8 L-5,-10 L-2,-16 L-3,-18 Z"/>
    <path id="rv" d="M0,-21 L0,21 M0,-12 L4,-8 M0,-12 L-4,-8 M0,-3 L4,1 M0,-3 L-4,1 M0,7 L3,11 M0,7 L-3,11"/>
    <g id="leaf">
      <use href="#r" stroke="#31402a" stroke-width="0.6" stroke-linejoin="round"/>
      <use href="#rv" fill="none" stroke="#3c4e33" stroke-width="0.8" opacity="0.8"/>
    </g>
    <g id="stalk">
      <path d="M0,0 C6,-30 6,-60 0,-100" fill="none" stroke="#5a4a3b" stroke-width="1.6" stroke-linecap="round"/>
      <use href="#leaf" fill="url(#lf)" transform="translate(-8 -14) rotate(-64)"/>
      <use href="#leaf" fill="url(#lf2)" transform="translate(12 -14) rotate(64)"/>
      <use href="#leaf" fill="url(#lu)" transform="translate(-7 -32) rotate(-60)"/>
      <use href="#leaf" fill="url(#lf)" transform="translate(13 -32) rotate(60)"/>
      <use href="#leaf" fill="url(#lf2)" transform="translate(-6 -50) rotate(-58) scale(0.95)"/>
      <use href="#leaf" fill="url(#lu)" transform="translate(12 -50) rotate(58) scale(0.95)"/>
      <use href="#leaf" fill="url(#lf)" transform="translate(-5 -68) rotate(-54) scale(0.88)"/>
      <use href="#leaf" fill="url(#lf2)" transform="translate(10 -68) rotate(54) scale(0.88)"/>
      <use href="#leaf" fill="url(#lf)" transform="translate(-4 -84) rotate(-50) scale(0.78)"/>
      <use href="#leaf" fill="url(#lu)" transform="translate(7 -84) rotate(50) scale(0.78)"/>
      <use href="#leaf" fill="url(#lf)" transform="translate(0 -104) rotate(0) scale(0.8)"/>
    </g>
  </defs>

  <path d="M128,248 C130,224 128,208 126,190" fill="none" stroke="#4f3f2f" stroke-width="3" stroke-linecap="round"/>
  <use href="#stalk" transform="translate(126 190) rotate(-52) scale(1.05)"/>
  <use href="#stalk" transform="translate(126 190) rotate(48) scale(1.05)"/>
  <use href="#stalk" transform="translate(126 190) rotate(-14) scale(1.25)"/>
  <use href="#stalk" transform="translate(126 190) rotate(18) scale(1.15)"/>
</svg>
