<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Berry sprig: a twig with four leaves and a hanging cluster of dull red
       berries, each with a dark eye and a small highlight. -->
  <defs>
    <linearGradient id="lf" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#7a9255"/>
      <stop offset="1" stop-color="#4e6a3d"/>
    </linearGradient>
    <linearGradient id="lf2" x1="0.3" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d8650"/>
      <stop offset="1" stop-color="#47603a"/>
    </linearGradient>
    <radialGradient id="br" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#c4685c"/>
      <stop offset="0.5" stop-color="#a1443b"/>
      <stop offset="1" stop-color="#5f251f"/>
    </radialGradient>
    <path id="lv" d="M0,-26 C8,-22 12,-8 9,6 C7,16 4,22 0,26 C-4,22 -7,16 -9,6 C-12,-8 -8,-22 0,-26 Z"/>
    <path id="lvv" d="M0,-22 L0,22 M0,-10 L6,-4 M0,-10 L-6,-4 M0,4 L5,9 M0,4 L-5,9"/>
    <g id="berry">
      <circle r="9" fill="url(#br)" stroke="#4a1d18" stroke-width="0.7"/>
      <circle cx="1" cy="-1" r="1.6" fill="#3a1512" opacity="0.8"/>
      <ellipse cx="-3" cy="-4" rx="2.2" ry="1.4" fill="#e0a294" opacity="0.5" transform="rotate(-30 -3 -4)"/>
    </g>
  </defs>
  <!-- twig -->
  <path d="M128,252 C126,220 124,180 128,150 M128,150 C110,140 90,124 80,108 M128,150 C146,138 164,124 176,106 M128,150 C130,130 132,110 128,80" fill="none" stroke="#5c4a37" stroke-width="3" stroke-linecap="round"/>
  <!-- leaves -->
  <g>
    <use href="#lv" fill="url(#lf2)" stroke="#36482c" stroke-width="0.7" transform="translate(80 108) rotate(-54) scale(1.05)"/>
    <use href="#lvv" fill="none" stroke="#3f5535" stroke-width="0.9" opacity="0.8" transform="translate(80 108) rotate(-54) scale(1.05)"/>
    <use href="#lv" fill="url(#lf)" stroke="#36482c" stroke-width="0.7" transform="translate(176 106) rotate(48) scale(1.0)"/>
    <use href="#lvv" fill="none" stroke="#3f5535" stroke-width="0.9" opacity="0.8" transform="translate(176 106) rotate(48) scale(1.0)"/>
    <use href="#lv" fill="url(#lf)" stroke="#36482c" stroke-width="0.7" transform="translate(128 78) rotate(-8) scale(1.15)"/>
    <use href="#lvv" fill="none" stroke="#3f5535" stroke-width="0.9" opacity="0.8" transform="translate(128 78) rotate(-8) scale(1.15)"/>
    <use href="#lv" fill="url(#lf2)" stroke="#36482c" stroke-width="0.7" transform="translate(150 196) rotate(120) scale(0.85)"/>
    <use href="#lvv" fill="none" stroke="#3f5535" stroke-width="0.9" opacity="0.8" transform="translate(150 196) rotate(120) scale(0.85)"/>
  </g>
  <!-- berry stalks then berries, back ones first -->
  <path d="M128,150 L110,172 M128,150 L128,180 M128,150 L146,170 M128,150 L118,190 M128,150 L138,192 M128,150 L100,186 M128,150 L156,186" fill="none" stroke="#6b4a3a" stroke-width="1.3"/>
  <use href="#berry" transform="translate(100 186) scale(0.9)"/>
  <use href="#berry" transform="translate(156 186) scale(0.9)"/>
  <use href="#berry" transform="translate(110 172)"/>
  <use href="#berry" transform="translate(146 170)"/>
  <use href="#berry" transform="translate(118 192) scale(1.05)"/>
  <use href="#berry" transform="translate(138 192) scale(1.05)"/>
  <use href="#berry" transform="translate(128 180) scale(1.1)"/>
</svg>
