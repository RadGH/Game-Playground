<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gravenhold — The First Room</title>
  <link rel="stylesheet" href="css/game.css">
  <script type="importmap">{"imports":{"three":"../../vendor/three/three.module.js","three/addons/":"../../vendor/three/addons/"}}</script>
</head>
<body>
  <canvas id="scene" aria-label="Gravenhold dungeon"></canvas>
  <section id="run-screen" class="run-screen"><div class="run-card"><h1 id="run-title">GRAVENHOLD</h1><p id="run-copy">Choose a class and enter the keep.</p><label for="start-class">Class</label><select id="start-class" aria-label="Starting class"></select><div id="meta-summary"></div><button id="start-run">Begin run</button></div></section>
  <main class="hud">
    <div class="title">GRAVENHOLD <span id="floor-label">FLOOR 1</span></div>
    <canvas id="minimap" width="150" height="150" aria-label="Dungeon minimap"></canvas>
    <div class="help">WASD or left stick to move · Space to attack · E at stairs to descend <b>·</b> <button id="tilt" type="button" aria-pressed="false">Tilt shift: off</button></div>
    <div class="classpick"><label for="class-select">Class</label><select id="class-select" aria-label="Choose class"></select><span id="mana">Mana 40 / 40</span></div>
    <div id="hotbar" aria-label="Skills"></div>
    <section id="bag" aria-label="Inventory"><b>Inventory <span id="bag-count"></span></b><div id="inventory"></div><div id="compare" aria-live="polite"></div><div id="equipment"><b>Worn</b><div id="equipment-slots"></div></div></section>
    <section id="level-panel"><b>Level-up</b><button id="level-up">Gain level</button><div id="level-options"></div><div id="build-picks"></div></section>
    <div id="target-hp" aria-label="Enemy health"></div>
    <div id="status" role="status">Preparing the dungeon…</div>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
