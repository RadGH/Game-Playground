<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Small leaves 1: birch. Three thin drooping twigs, each with alternating
       small triangular leaves. Fresh, slightly yellow green, lots of gaps. -->
  <defs>
    <linearGradient id="lf" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#8ea25a"/>
      <stop offset="1" stop-color="#5c7742"/>
    </linearGradient>
    <linearGradient id="lf2" x1="0.3" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f9754"/>
      <stop offset="1" stop-color="#52693d"/>
    </linearGradient>
    <linearGradient id="lu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8a5f"/>
      <stop offset="1" stop-color="#546343"/>
    </linearGradient>
    <path id="b" d="M0,-17 C7,-15 12,-6 10,4 C8,12 4,16 0,17 C-4,16 -8,12 -10,4 C-12,-6 -7,-15 0,-17 Z"/>
    <path id="bv" d="M0,-14 L0,15 M0,-7 L6,-2 M0,-7 L-6,-2 M0,3 L5,7 M0,3 L-5,7"/>
    <g id="leaf">
      <use href="#b" stroke="#3e4d30" stroke-width="0.6"/>
      <use href="#bv" fill="none" stroke="#4b5c38" stroke-width="0.8" opacity="0.8"/>
    </g>
    <!-- one twig with 8 alternating leaves, running up from the origin -->
    <g id="twig">
      <path d="M0,0 C4,-30 -2,-60 6,-100" fill="none" stroke="#5a4838" stroke-width="1.8" stroke-linecap="round"/>
      <use href="#leaf" fill="url(#lf)" transform="translate(3 -12) rotate(58) scale(1.1)"/>
      <use href="#leaf" fill="url(#lf2)" transform="translate(2 -26) rotate(-62)"/>
      <use href="#leaf" fill="url(#lf)" transform="translate(2 -40) rotate(54) scale(0.95)"/>
      <use href="#leaf" fill="url(#lu)" transform="translate(1 -54) rotate(-56) scale(0.9)"/>
      <use href="#leaf" fill="url(#lf2)" transform="translate(2 -68) rotate(50) scale(0.85)"/>
      <use href="#leaf" fill="url(#lf)" transform="translate(4 -82) rotate(-50) scale(0.8)"/>
      <use href="#leaf" fill="url(#lf2)" transform="translate(6 -96) rotate(40) scale(0.7)"/>
      <use href="#leaf" fill="url(#lf)" transform="translate(6 -104) rotate(-8) scale(0.6)"/>
    </g>
  </defs>

  <path d="M128,246 C126,220 122,200 120,180" fill="none" stroke="#54432f" stroke-width="3" stroke-linecap="round"/>
  <use href="#twig" transform="translate(120 180) rotate(-42) scale(1.15)"/>
  <use href="#twig" transform="translate(120 180) rotate(36) scale(1.2)"/>
  <use href="#twig" transform="translate(120 180) rotate(-6) scale(1.3)"/>
  <use href="#twig" transform="translate(126 214) rotate(70) scale(0.8)"/>
  <use href="#twig" transform="translate(124 206) rotate(-78) scale(0.75)"/>
</svg>
