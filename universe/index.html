<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Forge</title>
<link rel="stylesheet" href="../shared/style.css">
<link rel="stylesheet" href="universe.css">
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/addons/" } }</script>
</head>
<body>
<div class="topbar">
  <a href="../" class="muted">← Playground</a>
  <h1>Star Forge</h1>
  <span class="muted small">A galaxy of stars, their planets, and the surface of any one of them — <a href="../worldgen/">World Forge</a> maps every world. <a href="../assets/models.html">Space models</a></span>
  <span class="spacer"></span>
  <span id="status" class="small muted">booting…</span>
</div>

<div class="layout three">
  <aside class="sidebar" id="left"></aside>

  <main class="main map-main" id="main">
    <div class="crumbs" id="crumbs"></div>
    <div class="stage" id="stage">
      <canvas id="galaxy" class="view"></canvas>
      <div id="three" class="view" hidden></div>
      <canvas id="map" class="view" hidden></canvas>
      <div class="progress" id="progress" hidden><div class="bar"><span id="progressBar"></span></div><div id="progressLabel" class="small muted">working…</div></div>
    </div>
    <div class="readout" id="readout"><span class="muted small">Hover a star for its class, click it to fly in.</span></div>
    <div class="legend" id="legend"></div>
  </main>

  <aside class="sidebar right" id="right"></aside>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
