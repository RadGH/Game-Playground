<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Icon Library · Playground</title>
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="icons.css">
</head>
<body>
  <header class="topbar">
    <a href="../">← Home</a><h1>Icon Library</h1>
    <a href="../prototypes/thousandvale/">Thousandvale</a>
  </header>
  <main>
    <div class="intro"><div><h2>Spell pictures, all in one place.</h2>
      <p class="muted">Gold on midnight, following Starcaller. The same icons appear in Thousandvale’s action bar and spell book.</p></div>
      <p id="total" class="total"></p>
    </div>
    <form id="filters" role="search" aria-label="Filter icons">
      <label class="search">Search<input type="search" id="search" placeholder="Name, description, category…" autocomplete="off"></label>
      <label>Class<select id="class"><option value="">All classes</option></select></label>
      <label>Category<select id="category"><option value="">All categories</option></select></label>
      <label>Batch<select id="batch"><option value="">All batches</option><option value="0">Starcaller · reference</option></select></label>
      <button type="reset">Reset</button>
    </form>
    <div class="results-bar"><p id="count" role="status" aria-live="polite"></p><label>Preview size <select id="size"><option value="32">32 px</option><option value="48" selected>48 px</option><option value="64">64 px</option></select></label></div>
    <div id="grid" class="icon-grid"></div>
    <p id="empty" hidden>No icons match these filters. Try another word or reset the filters.</p>
    <noscript>JavaScript is needed to browse the icon library.</noscript>
  </main>
  <dialog id="detail" aria-labelledby="detail-name">
    <div class="detail-head"><h2 id="detail-name"></h2><button id="close" type="button" aria-label="Close icon details">Close</button></div>
    <div id="preview"></div><p id="description"></p><p id="detail-class" class="muted"></p>
    <div id="detail-categories" class="tags"></div><p><code id="icon-id"></code></p>
    <div class="actions"><button id="copy-id" type="button">Copy ID</button><button id="download" type="button">Download SVG</button></div>
    <p id="copy-status" role="status" aria-live="polite"></p>
  </dialog>
  <script type="module" src="js/app.js"></script>
</body>
</html>
