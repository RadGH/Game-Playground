<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Daisy: a stem with two small leaves and a head seen from slightly above,
       sixteen off-white petals round a domed yellow centre. Petals are two
       layers so the head has depth rather than reading as a flat star. -->
  <defs>
    <linearGradient id="pt" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#b7b5a3"/>
      <stop offset="1" stop-color="#dedcd0"/>
    </linearGradient>
    <linearGradient id="pt2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#9f9d8c"/>
      <stop offset="1" stop-color="#c8c6b8"/>
    </linearGradient>
    <radialGradient id="ct" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#d5b65a"/>
      <stop offset="0.7" stop-color="#b8953f"/>
      <stop offset="1" stop-color="#8a6c2c"/>
    </radialGradient>
    <linearGradient id="st" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4c6538"/>
      <stop offset="1" stop-color="#6c8749"/>
    </linearGradient>
    <ellipse id="pe" cx="0" cy="-36" rx="7" ry="22"/>
    <path id="lf" d="M0,0 C8,-6 18,-8 26,-4 C18,4 8,6 0,0 Z"/>
  </defs>
  <!-- stem and leaves -->
  <path d="M128,252 C126,220 124,180 128,120" fill="none" stroke="url(#st)" stroke-width="4" stroke-linecap="round"/>
  <use href="#lf" fill="#5d773f" stroke="#3f532c" stroke-width="0.7" transform="translate(126 196) rotate(-30) scale(1.2)"/>
  <use href="#lf" fill="#67824a" stroke="#3f532c" stroke-width="0.7" transform="translate(126 166) rotate(200) scale(1.1)"/>
  <!-- back petal ring, slightly darker and rotated half a step -->
  <g transform="translate(128 96)" fill="url(#pt2)" stroke="#8b8977" stroke-width="0.5">
    <use href="#pe" transform="rotate(11.25)"/><use href="#pe" transform="rotate(33.75)"/>
    <use href="#pe" transform="rotate(56.25)"/><use href="#pe" transform="rotate(78.75)"/>
    <use href="#pe" transform="rotate(101.25)"/><use href="#pe" transform="rotate(123.75)"/>
    <use href="#pe" transform="rotate(146.25)"/><use href="#pe" transform="rotate(168.75)"/>
    <use href="#pe" transform="rotate(191.25)"/><use href="#pe" transform="rotate(213.75)"/>
    <use href="#pe" transform="rotate(236.25)"/><use href="#pe" transform="rotate(258.75)"/>
    <use href="#pe" transform="rotate(281.25)"/><use href="#pe" transform="rotate(303.75)"/>
    <use href="#pe" transform="rotate(326.25)"/><use href="#pe" transform="rotate(348.75)"/>
  </g>
  <!-- front petal ring -->
  <g transform="translate(128 96)" fill="url(#pt)" stroke="#9a9886" stroke-width="0.5">
    <use href="#pe"/><use href="#pe" transform="rotate(22.5)"/>
    <use href="#pe" transform="rotate(45)"/><use href="#pe" transform="rotate(67.5)"/>
    <use href="#pe" transform="rotate(90)"/><use href="#pe" transform="rotate(112.5)"/>
    <use href="#pe" transform="rotate(135)"/><use href="#pe" transform="rotate(157.5)"/>
    <use href="#pe" transform="rotate(180)"/><use href="#pe" transform="rotate(202.5)"/>
    <use href="#pe" transform="rotate(225)"/><use href="#pe" transform="rotate(247.5)"/>
    <use href="#pe" transform="rotate(270)"/><use href="#pe" transform="rotate(292.5)"/>
    <use href="#pe" transform="rotate(315)"/><use href="#pe" transform="rotate(337.5)"/>
  </g>
  <!-- centre: shadow, dome, and a scatter of tiny florets -->
  <circle cx="129" cy="98" r="17" fill="#6a5a2e" opacity="0.5"/>
  <circle cx="128" cy="96" r="16" fill="url(#ct)" stroke="#7a5f28" stroke-width="0.8"/>
  <g fill="#a0842f" opacity="0.6">
    <circle cx="122" cy="92" r="1.6"/><circle cx="130" cy="89" r="1.4"/><circle cx="135" cy="95" r="1.6"/>
    <circle cx="126" cy="100" r="1.5"/><circle cx="133" cy="102" r="1.3"/><circle cx="120" cy="99" r="1.2"/>
  </g>
</svg>
