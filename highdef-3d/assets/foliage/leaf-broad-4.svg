      <stop offset="0" stop-color="#7f9556"/>
      <stop offset="0.6" stop-color="#5c7642"/>
      <stop offset="1" stop-color="#485f35"/>
    </linearGradient>
    <linearGradient id="turn" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#a8a45a"/>
      <stop offset="0.6" stop-color="#8b8a48"/>
      <stop offset="1" stop-color="#6b7239"/>
    </linearGradient>
    <linearGradient id="turn2" x1="0.2" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b09d55"/>
      <stop offset="0.6" stop-color="#8f8646"/>
      <stop offset="1" stop-color="#6d6a38"/>
    </linearGradient>
    <linearGradient id="under" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#71825a"/>
