<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forest Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/hvf-map.css">
</head>
<body>
<!-- Hunters vs Farmers world generator (docs/hvf-PLAN.md §3.4): one seed with layers + metrics, or a
     16-seed compare grid to judge the generator by eye. URL: ?seed=7&format=5v2&view=one|grid -->
<header class="bar">
  <a class="back" href="./">&larr; Bannerline</a>
  <h1>Hunters vs Farmers <span>forest generator</span></h1>
  <span class="spacer"></span>
  <div class="seg" id="view">
    <button data-v="one" class="on">One map</button><button data-v="grid">Compare 16</button>
  </div>
  <label>Format <select id="format"></select></label>
  <label>Seed <input id="seed" type="number" min="0" step="1" value="1"></label>
  <button class="btn" id="prev" title="Previous seed">&lsaquo;</button>
  <button class="btn" id="next" title="Next seed">&rsaquo;</button>
  <button class="btn primary" id="random">Random</button>
</header>
<main id="one">
  <div class="stage"><canvas id="map"></canvas><div class="hover" id="hover"></div></div>
  <aside class="side">
    <section>
      <h2>Layers</h2>
      <div class="layers" id="layers"></div>
    </section>
    <section>
      <h2>Legend</h2>
      <div class="legend" id="legend"></div>
    </section>
    <section>
      <h2>Metrics</h2>
      <table class="metrics" id="metrics"></table>
      <p class="note" id="status"></p>
    </section>
    <section>
      <h2>Hollows</h2>
      <div class="hollows" id="hollows"></div>
    </section>
  </aside>
</main>
<main id="grid" hidden>
  <div class="grid" id="tiles"></div>
</main>
<script type="module" src="js/tools/hvf-map-page.js"></script>
</body>
</html>
