<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bannerline Crowd Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/bench.css">
<script type="importmap">{ "imports": { "three": "../../vendor/three/three.module.js", "three/addons/": "../../vendor/three/addons/" } }</script>
</head>
<body class="tool-page">
<!--
  The M1 crowd benchmark (docs/PLAN.md §15.2). Draws 20/40/60/80 units per viewport — Chibi 2
  humanoids and merged creatures from the real unit table, walking, attacking and casting with
  BatchedSpellFx — through the game's own renderer and RTS camera, in one and two viewports.
  The owner runs it on his own machine; tools/bench-bannerline.mjs runs it headless (software
  rendering, so only draw calls and triangles mean anything there).
-->
<div class="bench">
  <header class="bench-bar">
    <a class="back" href="./">&larr; Bannerline</a>
    <h1>Crowd Bench</h1>
    <span class="muted" id="state">Loading models&hellip;</span>
    <span class="spacer"></span>
    <label>Resolution <select id="pr"><option value="1">1x</option><option value="device">Device</option></select></label>
    <label>Unit scale <select id="us"><option value="1.6" selected>1.6</option><option value="1">1.0</option><option value="2.2">2.2</option></select></label>
    <label>Frames <select id="frames"><option>120</option><option selected>240</option><option>480</option></select></label>
    <button class="btn primary" id="run" disabled>Run all cases</button>
    <button class="btn" id="copy" disabled>Copy results</button>
  </header>
  <div class="bench-main">
    <canvas id="view" aria-label="Benchmark view"></canvas>
    <div class="bench-live" id="live">--</div>
    <div class="vp-label" id="vp0">Viewport 1</div>
    <div class="vp-label" id="vp1" hidden>Viewport 2</div>
    <div class="bench-portrait" id="portrait" title="Live portrait (js/view/portrait.js): click to cycle units"></div>
  </div>
  <section class="bench-results">
    <div class="manual">
      <span>Try one:</span>
      <label>Units per viewport <select id="n"><option>20</option><option selected>40</option><option>60</option><option>80</option></select></label>
      <label>Viewports <select id="v"><option>1</option><option selected>2</option></select></label>
      <label>Stand-ins <select id="si"><option value="0" selected>off</option><option value="25">beyond nearest 25</option></select></label>
      <button class="btn" id="apply">Show</button>
      <span class="muted small">Keep this tab visible and in front while a run is going.</span>
    </div>
    <table id="table">
      <thead><tr><th>Case</th><th>Bodies</th><th>FPS</th><th>Frame ms</th><th>p95 ms</th><th>Draw calls</th><th>Triangles</th><th>Anim CPU ms</th><th>Render CPU ms</th></tr></thead>
      <tbody></tbody>
    </table>
    <p class="verdict" id="verdict"></p>
  </section>
</div>
<script type="module" src="js/bench/bench.js"></script>
</body>
</html>
